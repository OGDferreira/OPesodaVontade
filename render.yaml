services:
  - type: web
    name: o-peso-da-vontade
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_HOTMART_CHECKOUT_URL
        sync: false
